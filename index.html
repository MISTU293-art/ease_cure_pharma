<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Scanner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    background:#eef2f7;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.scanner-card{
    width:650px;
    border:none;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.card-header{
    background:#0d6efd;
    color:white;
    font-size:24px;
    font-weight:600;
    text-align:center;
}

#reader{
    width:100%;
    border-radius:10px;
    overflow:hidden;
}

.result-box{
    background:#f8f9fa;
    border:2px dashed #0d6efd;
    border-radius:10px;
    padding:15px;
    font-size:22px;
    font-weight:bold;
    color:#198754;
    min-height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.status{
    font-weight:600;
    color:#6c757d;
}

.btn{
    width:180px;
}
</style>

</head>
<body>

<audio id="beep" src="beep.mp3" preload="auto"></audio>

<div class="card scanner-card">

    <div class="card-header">
        📦 Barcode Scanner
    </div>

    <div class="card-body">

        <div id="reader"></div>

        <div class="text-center mt-4">

            <button class="btn btn-success me-2" id="startBtn">
                ▶ Start Scan
            </button>

            <button class="btn btn-danger" id="stopBtn">
                ⏹ Stop Scan
            </button>

        </div>

        <hr>

        <h5>Scanned Barcode</h5>

        <div class="result-box" id="result">
            Waiting for scan...
        </div>

        <p class="status mt-3 text-center" id="status">
            Scanner Stopped
        </p>

    </div>

</div>

<script>

const html5QrCode = new Html5Qrcode("reader");

let isScanning = false;
let lastScanned = "";

function onScanSuccess(decodedText){

    if(decodedText===lastScanned){
        return;
    }

    lastScanned=decodedText;

    document.getElementById("beep").play();

    document.getElementById("result").innerHTML=decodedText;

    setTimeout(()=>{
        lastScanned="";
    },2000);

}

function onScanFailure(error){
    // Ignore errors
}

async function startScanner(){

    if(isScanning) return;

    try{

        const devices=await Html5Qrcode.getCameras();

        if(devices.length){

            await html5QrCode.start(

                devices[0].id,

                {
                    fps:10,
                    qrbox:{
                        width:250,
                        height:250
                    }
                },

                onScanSuccess,
                onScanFailure

            );

            isScanning=true;

            document.getElementById("status").innerHTML="🟢 Scanner Running";

        }

    }catch(err){

        console.log(err);

        alert("Unable to access camera.");

    }

}

async function stopScanner(){

    if(!isScanning) return;

    await html5QrCode.stop();

    isScanning=false;

    document.getElementById("status").innerHTML="🔴 Scanner Stopped";

}

document.getElementById("startBtn").addEventListener("click",startScanner);

document.getElementById("stopBtn").addEventListener("click",stopScanner);

</script>

</body>
</html>
